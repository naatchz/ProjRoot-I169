# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

# Serveur HTTPS (Reverse Proxy)
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # Certificats SSL/TLS
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Bonnes pratiques SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de sécurité recommandés
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Configuration du Proxy
    location / {
        # 'app' correspond au nom du service Docker dans docker-compose.yml
        proxy_pass http://wordpress:80;

        # Transmettre les informations du client d'origine
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de sécurité
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
